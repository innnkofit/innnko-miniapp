:root{
  /* палитра с твоих фото: пена, карамельный «сёрдж», стаут, дерево стойки, золото арфы, жёлтая плашка, бирюза ногтя */
  --stout:#120c08; --stout2:#1c140e; --dark:#241d17; --wood:#593c2c; --wood2:#3d291d;
  --tan:#ae825d; --caramel:#87562d; --foam:#e8dfcd; --cream:#f2ebdc;
  --gold:#d4ad55; --yellow:#f6c85f; --ink:#1c140c; --teal:#2fa597;
  --muted:#a8957f; --dim:#76654f; --line:rgba(212,173,85,.20);
  --card:rgba(28,20,14,.9); --ok:#5FB36B; --warn:#E8963E; --bad:#E0605A;
  --radius:18px; --safe-b:env(safe-area-inset-bottom,0px);
  --head:"Russo One",Impact,"Arial Black",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stout);color:var(--cream);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(ellipse at 50% -10%,rgba(174,130,93,.22),transparent 55%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px),
    linear-gradient(180deg,#160f0a,#0c0806);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.H{font-family:var(--head);font-weight:400;letter-spacing:.01em}

#bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bubbles i{position:absolute;bottom:-20px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(242,235,220,.55),rgba(174,130,93,.14) 60%,transparent 70%);
  animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.5}100%{transform:translate(var(--dx),-110vh);opacity:0}}
@media (prefers-reduced-motion:reduce){#bubbles{display:none}}

.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:12px 16px calc(150px + var(--safe-b))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font-family:var(--head);font-weight:400;font-size:16px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sh{color:var(--teal);font-size:18px}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--wood),var(--wood2));border:1px solid var(--line);color:var(--yellow);font-size:19px}

/* hero */
.hero{position:relative;border-radius:22px;padding:18px 16px 16px;overflow:hidden;
  background:
    repeating-linear-gradient(176deg,rgba(0,0,0,.20) 0 3px,transparent 3px 11px),
    repeating-linear-gradient(183deg,rgba(255,220,160,.035) 0 1px,transparent 1px 23px),
    linear-gradient(160deg,#6a4733,var(--wood) 30%,var(--wood2) 75%);
  border:1px solid rgba(212,173,85,.35);
  box-shadow:inset 0 1px 0 rgba(255,230,180,.10),0 14px 40px rgba(0,0,0,.45)}
.heroTop{display:flex;gap:10px;align-items:stretch}
.heroL{flex:1;min-width:0}
.tag{display:inline-block;background:var(--yellow);color:var(--ink);font-family:var(--head);font-size:12px;letter-spacing:.06em;padding:4px 9px 3px;border-radius:4px;box-shadow:0 3px 0 rgba(0,0,0,.35);text-transform:uppercase;white-space:nowrap}
.dayRow{display:flex;align-items:flex-end;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.dayNum{font-family:var(--head);font-size:40px;line-height:1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45);white-space:nowrap}
.dayNum small{font-size:18px;color:var(--foam);margin-left:3px}
.fire{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(246,200,95,.5);font-family:var(--head);font-size:16px;color:var(--yellow);margin-bottom:3px}
.fire.zero{opacity:.55}
.dateLine{font-size:15px;color:var(--cream)}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{height:32px;padding:0 12px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--foam);font-size:13px}
.nav button:disabled{opacity:.3}
.pint{width:80px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pint svg{width:76px;height:122px;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.pintPct{font-family:var(--head);font-size:19px;color:var(--yellow);margin-top:4px}
.weeksBar{display:flex;gap:3px;margin-top:16px}
.weeksBar span{flex:1;height:8px;border-radius:3px;background:rgba(0,0,0,.38);overflow:hidden;position:relative}
.weeksBar span b{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--caramel),var(--tan) 60%,var(--foam))}
.weeksBar span.cur{outline:1px solid var(--foam);outline-offset:1px}
.barMeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--foam);opacity:.8;margin-top:7px}

/* weak link */
.weak{margin-top:14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;
  background:linear-gradient(90deg,rgba(47,165,151,.16),rgba(28,20,14,.9) 70%);border:1px solid rgba(47,165,151,.4);color:var(--cream)}
.weak .ic{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--c);font-size:17px}
.weak .tx{flex:1;min-width:0}
.weak .k{font-family:var(--head);font-size:11px;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}
.weak .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weak .s{font-size:12px;color:var(--muted)}

/* cards */
.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px}
.cardH{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.cardH h2{margin:0;font-family:var(--head);font-weight:400;font-size:18px;color:#fff;letter-spacing:.01em}
.cardH .meta{font-family:var(--head);font-size:14px;color:var(--yellow)}
.hint{font-size:12px;color:var(--dim);margin:-4px 0 8px}

.task{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;margin-bottom:7px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
.task.main{border-color:rgba(246,200,95,.6);background:linear-gradient(90deg,rgba(246,200,95,.15),rgba(246,200,95,.02))}
.task .n{font-family:var(--head);color:var(--yellow);width:14px;text-align:center;flex:none}
.task input[type=text]{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:6px 0;font-size:15px;color:var(--cream)}
.task input::placeholder{color:var(--dim)}
.task.done input[type=text]{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(246,200,95,.6)}
.chk{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid var(--yellow);display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:15px;transition:.15s}
.task.done .chk{background:var(--yellow)}

.goalGroup{margin:4px 0 10px}
.goalLabel{display:flex;align-items:center;gap:8px;font-family:var(--head);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:4px 2px 6px}
.goalLabel i{width:9px;height:9px;border-radius:50%}
.habit{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px;border-radius:12px;text-align:left;color:var(--cream);font-size:15px;background:rgba(255,255,255,.02);margin-bottom:6px;border:1px solid rgba(255,255,255,.04);transition:box-shadow .3s}
.habit:active{transform:scale(.99)}
.habit.flash{box-shadow:0 0 0 2px var(--teal)}
.dot{width:26px;height:26px;border-radius:50%;flex:none;border:2.5px solid var(--c);transition:background .18s, box-shadow .18s, transform .18s}
.habit.on .dot{background:var(--c);box-shadow:0 0 12px var(--c);transform:scale(1.05)}
.habit.on .hn{color:#fff}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + var(--safe-b));
  background:linear-gradient(180deg,rgba(18,12,8,0),rgba(18,12,8,.95) 30%)}
.dockIn{max-width:448px;margin:0 auto}
.cta{width:100%;height:54px;border-radius:12px;font-family:var(--head);font-size:18px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);
  background:var(--yellow);border:0;box-shadow:0 5px 0 #b98d2c,0 10px 24px rgba(0,0,0,.45)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #b98d2c}
.cta.closed{background:linear-gradient(180deg,var(--wood),var(--wood2));color:var(--yellow);box-shadow:0 4px 0 #22170f;text-transform:none;font-size:16px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tabs button{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);color:var(--muted);background:rgba(0,0,0,.4);font-family:var(--head);font-size:14px}
.tabs button.act{color:#fff;background:linear-gradient(180deg,var(--wood),var(--wood2));border-color:rgba(212,173,85,.45)}

/* week */

.photoBan:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,12,8,.94) 0%,rgba(18,12,8,.6) 30%,rgba(18,12,8,0) 52%,rgba(18,12,8,0) 82%,rgba(18,12,8,.65))}
.photoBan .in{position:absolute;left:16px;right:16px;top:14px;z-index:1}
.photoBan .t{font-family:var(--head);font-size:30px;color:#fff;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.5);margin-top:8px}
.photoBan .s{font-size:13px;color:var(--foam);margin-top:4px}
.wnav{position:absolute;bottom:12px;right:12px;display:flex;gap:8px;z-index:1}
.wnav button{width:38px;height:38px;border-radius:11px;background:rgba(18,12,8,.6);border:1px solid var(--line);color:var(--yellow);font-size:16px;backdrop-filter:blur(4px)}
.wnav button:disabled{opacity:.25}
.score{display:flex;align-items:center;gap:16px}
.ring{width:104px;height:104px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:27px;color:#fff}
.zone{font-family:var(--head);font-size:12px;letter-spacing:.03em;padding:4px 9px 3px;border-radius:4px;display:inline-block;margin-bottom:8px;color:var(--ink)}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--cream)}
.stat span:last-child{color:var(--yellow);font-family:var(--head)}
.mini{height:6px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:12px}
.mini b{display:block;height:100%;background:linear-gradient(90deg,var(--caramel),var(--tan),var(--foam))}
.daysRow{display:flex;gap:5px;margin-top:10px}
.daysRow div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.daysRow div i{display:block;height:28px;border-radius:8px;margin-bottom:4px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05)}
.daysRow div.cl i{background:linear-gradient(180deg,var(--foam) 0 22%,#2a1c12 22%);border-color:var(--foam)}
.daysRow div.part i{background:linear-gradient(180deg,rgba(232,223,205,.25) 0 22%,rgba(135,86,45,.35) 22%)}
.daysRow div.fut i{opacity:.35}
.daysRow div.now{color:#fff;font-weight:700}
.legend{font-size:11px;color:var(--dim);margin-top:6px}
.gbar{margin:8px 0}
.gbar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.gbar .top span:last-child{font-family:var(--head)}
.gbar .track{height:8px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
.gbar .track b{display:block;height:100%;border-radius:4px}
textarea{width:100%;min-height:70px;resize:vertical;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--cream);outline:0}
textarea:focus,.field input:focus,.field select:focus{border-color:var(--yellow)}
.lbl{font-family:var(--head);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tan);margin:14px 2px 6px}
.btn2{width:100%;height:46px;border-radius:12px;margin-top:12px;background:linear-gradient(180deg,var(--wood),var(--wood2));border:1px solid rgba(212,173,85,.45);color:var(--yellow);font-family:var(--head);font-size:14px}
.saved{font-size:12px;color:var(--ok);text-align:center;min-height:16px;margin-top:6px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheetIn{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#22170f,#120c08);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + var(--safe-b))}
.sheetH{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheetH h3{margin:0;font-family:var(--head);font-weight:400;font-size:21px;color:#fff}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{height:44px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:0 12px;color:var(--cream);outline:0;width:100%}
.field select option,.hEdit select option{background:#22170f}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);margin-bottom:10px;font-size:14px}
.switch input{width:22px;height:22px;accent-color:var(--teal)}
.hEdit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.hEdit input{flex:1;min-width:0;height:42px;border-radius:11px;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:0 10px;outline:0}
.hEdit select{width:64px;height:42px;border-radius:11px;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:0 6px;outline:0}
.hEdit .sw{width:12px;height:42px;border-radius:6px;flex:none}
.del{width:42px;height:42px;border-radius:11px;background:rgba(224,96,90,.12);border:1px solid rgba(224,96,90,.35);color:#f19a95;flex:none;font-size:16px}
.gEdit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.gEdit input{flex:1;min-width:0;height:42px;border-radius:11px;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:0 10px;outline:0}
.gEdit input[type=color]{flex:none;width:42px;padding:3px;cursor:pointer}
.gBox{padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:rgba(0,0,0,.18)}
.gBox .gEdit{margin-bottom:8px}
.gNums{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:6px}
.gNums label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.gNums input,.gNums select{height:38px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:0 8px;outline:0;width:100%;min-width:0}
.gNums select option{background:#22170f}
.goalRow{margin:10px 0 12px}
.goalRow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:3px}
.goalRow .top b{font-family:var(--head);font-weight:400}
.goalRow .sub{font-size:12px;color:var(--muted);margin-bottom:5px}
.goalRow .track{height:10px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden}
.goalRow .track b{display:block;height:100%;border-radius:5px}
.note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.45}
.danger{color:#f19a95;border-color:rgba(224,96,90,.4)}

/* story */
.story{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.story.open{display:flex}

.storyCard:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,12,8,.82) 0%,rgba(18,12,8,.25) 30%,rgba(18,12,8,.15) 48%,rgba(18,12,8,.8) 70%,rgba(18,12,8,.97) 100%)}
.storyCard>*{position:relative;z-index:1}
.stTop{padding:18px 18px 0}
.stBig{font-family:var(--head);font-size:62px;line-height:1;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.5);margin-top:12px}
.stBig small{font-size:24px;color:var(--foam)}
.stFire{font-family:var(--head);color:var(--yellow);font-size:17px;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.stBottom{margin-top:auto;padding:0 16px 16px}
.stBar{height:10px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid rgba(232,223,205,.25)}
.stBar b{display:block;height:100%;background:linear-gradient(90deg,var(--caramel),var(--tan) 70%,var(--foam))}
.stBarT{display:flex;justify-content:space-between;font-size:12px;color:var(--foam);margin:6px 0 10px}
.storyStats{display:flex;gap:8px}
.storyStats div{flex:1;background:rgba(18,12,8,.65);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.storyStats b{display:block;font-family:var(--head);font-weight:400;font-size:20px;color:#fff}
.storyStats span{font-size:11px;color:var(--muted)}
.storyDots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.storyDots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--c)}
.storyDots i.on{background:var(--c)}
.storySig{text-align:center;font-family:var(--head);font-size:14px;color:var(--yellow);margin-top:10px}
.storyHint{color:var(--muted);font-size:13px;margin-top:12px;text-align:center}
.storyBtns{display:flex;gap:10px;margin-top:10px;width:min(340px,100%)}
.storyBtns button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--cream)}

.stub{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.stub svg{width:90px;height:144px}
.stub h2{font-family:var(--head);font-weight:400;color:#fff;margin:14px 0 6px;font-size:24px}
.stub p{color:var(--muted);max-width:300px;margin:0 0 18px}
.stub .btn2{max-width:240px}
.loader{min-height:80vh;display:grid;place-items:center;color:var(--muted);font-family:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;background:var(--yellow);color:var(--ink);font-family:var(--head);padding:9px 14px;border-radius:8px;font-size:13px;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

<body>
<div id="bubbles"></div>
<div class="wrap" id="app"><div class="loader">Наливаем… 🍺</div></div>

<div class="dock hidden" id="dock"><div class="dockIn">
  <button class="cta" id="cta">Закрыть день</button>
  <div class="tabs">
    <button id="tabDay" class="act">День</button>
    <button id="tabWeek">Неделя</button>
  </div>
</div></div>

<div class="sheet" id="sheet"><div class="sheetIn" id="sheetIn"></div></div>
<div class="story" id="story"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); tg.expand(); } catch(e){}
  try { tg.setHeaderColor && tg.setHeaderColor('#120c08'); tg.setBackgroundColor && tg.setBackgroundColor('#120c08'); } catch(e){}
}

/* ---------- helpers ---------- */
var $ = function(id){ return document.getElementById(id); };
var each = function(sel,fn){ Array.prototype.forEach.call(document.querySelectorAll(sel),fn); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var WDS=['вс','пн','вт','ср','чт','пт','сб'];
function parseYMD(s){ var p=String(s).split('-'); return Date.UTC(+p[0],+p[1]-1,+p[2]); }
function todayUTC(){ var d=new Date(); return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()); }
function dateOfDay(n){ return new Date(parseYMD(S.cfg.settings.startDate)+(n-1)*864e5); }
function fmtDate(d){ return WD[d.getUTCDay()]+', '+d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]; }
function fmtShort(d){ return d.getUTCDate()+'.'+String(d.getUTCMonth()+1).padStart(2,'0'); }
function plural(n,a,b,c){ n=Math.abs(n)%100; var m=n%10; if(n>10&&n<20)return c; if(m>1&&m<5)return b; if(m===1)return a; return c; }
function haptic(t){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},1800); }
function askConfirm(msg,cb){
  try{ if(tg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2') && tg.initData){ tg.showConfirm(msg,function(ok){cb(!!ok);}); return; } }catch(e){}
  cb(window.confirm(msg));
}

(function(){ var b=$('bubbles'); for(var i=0;i<16;i++){ var e=document.createElement('i'); var s=3+Math.random()*7;
  e.style.cssText='left:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+(9+Math.random()*12)+'s;animation-delay:'+(-Math.random()*20)+'s;--dx:'+((Math.random()-.5)*40)+'px';
  b.appendChild(e);} })();

/* ---------- storage: Telegram CloudStorage → localStorage → memory ---------- */
var PREFIX='t100_';
var Store=(function(){
  var cloud=false;
  try{ cloud=!!(tg && tg.initData && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')); }catch(e){}
  var mem={};
  function lsGet(k){ try{ return localStorage.getItem(PREFIX+k); }catch(e){ return mem[k]==null?null:mem[k]; } }
  function lsSet(k,v){ try{ localStorage.setItem(PREFIX+k,v); }catch(e){ mem[k]=v; } }
  function lsKeys(){ var out=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k.indexOf(PREFIX)===0) out.push(k.slice(PREFIX.length)); } }catch(e){ out=Object.keys(mem); } return out; }
  function lsDel(k){ try{ localStorage.removeItem(PREFIX+k); }catch(e){ delete mem[k]; } }
  return {
    kind: cloud ? 'Telegram Cloud (видно на всех твоих устройствах)' : 'этот браузер (только на этом устройстве)',
    loadAll: function(){ return new Promise(function(res){
      if(!cloud){ var o={}; lsKeys().forEach(function(k){ o[k]=lsGet(k); }); return res(o); }
      try{ tg.CloudStorage.getKeys(function(err,keys){
        if(err||!keys||!keys.length) return res({});
        keys=keys.filter(function(k){return k.indexOf(PREFIX)===0;});
        if(!keys.length) return res({});
        tg.CloudStorage.getItems(keys,function(err2,vals){ var o={}; if(!err2&&vals){ keys.forEach(function(k){ if(vals[k]) o[k.slice(PREFIX.length)]=vals[k]; }); } res(o); });
      }); }catch(e){ res({}); }
    });},
    set: function(k,v){ var s=JSON.stringify(v);
      if(cloud){ try{ tg.CloudStorage.setItem(PREFIX+k,s,function(err){ if(err) toast('Не сохранилось в облако'); }); }catch(e){} }
      else lsSet(k,s);
    },
    clear: function(){ return new Promise(function(res){
      if(cloud){ try{ tg.CloudStorage.getKeys(function(err,keys){ keys=(keys||[]).filter(function(k){return k.indexOf(PREFIX)===0;}); if(!keys.length) return res(); tg.CloudStorage.removeItems(keys,function(){res();}); }); }catch(e){res();} }
      else { lsKeys().forEach(lsDel); res(); }
    });}
  };
})();

/* ---------- state ---------- */
var S={ cfg:null, days:{}, weeks:{}, base:null, viewDay:1, tab:'day', viewWeek:1 };
function cfgSnapshot(){ return {settings:S.cfg.settings, goals:S.cfg.goals, habits:S.cfg.habits}; }
function saveCfg(){ Store.set('cfg',cfgSnapshot()); }
function saveDay(n){ Store.set('d'+n,S.days[n]); }
function saveWeek(w){ Store.set('w'+w,S.weeks[w]); }
var timers={};
function later(key,fn){ clearTimeout(timers[key]); timers[key]=setTimeout(fn,500); }

function getDay(n){ if(!S.days[n]) S.days[n]={h:[],t:[],c:0}; var d=S.days[n]; d.h=d.h||[]; d.t=d.t||[]; while(d.t.length<3) d.t.push({x:'',d:false}); return d; }
function getWeek(w){ if(!S.weeks[w]) S.weeks[w]={plan:[],wins:'',lessons:''}; var x=S.weeks[w]; x.plan=x.plan||[]; while(x.plan.length<3) x.plan.push({x:'',d:false}); return x; }
function goalById(id){ for(var i=0;i<S.cfg.goals.length;i++) if(S.cfg.goals[i].id==id) return S.cfg.goals[i]; return {id:id,name:'Без цели',color:'#a8957f'}; }
function hById(id){ for(var i=0;i<S.cfg.habits.length;i++) if(S.cfg.habits[i].id===id) return S.cfg.habits[i]; return {}; }

function num(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n)?n:null; }
function fmtNum(v){ return v==null?'—':String(Math.round(v*100)/100).replace('.',','); }
/* % достижения цели, как в твоём Excel: «меньше» = (старт − сейчас)/(старт − цель), «больше» = (сейчас − старт)/(цель − старт) */
function goalPct(g){ var a=num(g.start), t=num(g.target), c=num(g.current); if(a==null||t==null||c==null||a===t) return null;
  var p = g.direction==='less' ? (a-c)/(a-t) : (c-a)/(t-a); return Math.max(0,Math.min(100,Math.round(p*100))); }
/* ---------- cycle math ---------- */
function cycleDays(){ return +S.cfg.settings.cycleDays||100; }
function rawToday(){ return Math.floor((todayUTC()-parseYMD(S.cfg.settings.startDate))/864e5)+1; }
function curDay(){ return Math.max(1,Math.min(cycleDays(),rawToday())); }
function weekOffset(){ if(S.cfg.settings.weekStart!=='monday') return 0; var wd=new Date(parseYMD(S.cfg.settings.startDate)).getUTCDay(); return (wd+6)%7; }
function weekOf(n){ return Math.floor((n-1+weekOffset())/7)+1; }
function totalWeeks(){ return weekOf(cycleDays()); }
function weekRange(w){ var off=weekOffset(); var a=Math.max(1,(w-1)*7-off+1); var b=Math.min(cycleDays(),w*7-off); return [a,b]; }

/* серия: сколько дней подряд закрыто. Сегодняшний незакрытый день серию не рвёт — ещё не вечер */
function streakAt(n){ var s=0; for(var i=n;i>=1;i--){ if(S.days[i]&&S.days[i].c) s++; else if(i===n) continue; else break; } return s; }
function dayStats(n){ var d=S.days[n]||{h:[],t:[],c:0}; var ids=S.cfg.habits.map(function(h){return h.id;});
  var hd=(d.h||[]).filter(function(id){return ids.indexOf(id)>=0;}).length;
  var tp=(d.t||[]).filter(function(t){return t.x&&t.x.trim();}); var td=tp.filter(function(t){return t.d;}).length;
  return {hd:hd,ht:ids.length,td:td,tt:tp.length,c:d.c}; }
/* слабое звено: привычка с наименьшим числом отметок за последние 7 дней (без сегодняшнего) */
function weakest(){
  var today=curDay(); if(today<2||!S.cfg.habits.length) return null;
  var a=Math.max(1,today-7), b=today-1, len=b-a+1, best=null;
  S.cfg.habits.forEach(function(x,idx){ var cnt=0, all=0;
    for(var n=a;n<=b;n++){ var d=S.days[n]; if(d&&d.h&&d.h.indexOf(x.id)>=0) cnt++; }
    for(var m=1;m<=b;m++){ var e=S.days[m]; if(e&&e.h&&e.h.indexOf(x.id)>=0) all++; }
    var score=cnt*1000+all; if(!best||score<best.score) best={h:x,cnt:cnt,len:len,score:score}; });
  return best;
}

/* ---------- pint svg: форма тюльпана как на твоём фото ---------- */
var GLASS='M15 7 L85 7 C88 20 91 34 90 48 C89 74 81 108 75 146 L75 153 Q75 157 71 157 L29 157 Q25 157 25 153 L25 146 C19 108 11 74 10 48 C9 34 12 20 15 7 Z';
function pintSVG(pct,id){
  pct=Math.max(0,Math.min(100,pct));
  var top=9,bot=154,H=bot-top; var level=bot-H*pct/100; var foam=pct>0?Math.min(13,Math.max(4,H*pct/100*.9)):0;
  var surge=Math.min(22,(bot-level)*.35);
  return '<svg viewBox="0 0 100 160" aria-label="Пинта налита на '+Math.round(pct)+'%">'+
   '<defs><clipPath id="g'+id+'"><path d="'+GLASS+'"/></clipPath>'+
   '<linearGradient id="s'+id+'" x1="0" x2="1"><stop offset="0" stop-color="#0d0806"/><stop offset=".42" stop-color="#2a1b12"/><stop offset=".58" stop-color="#241710"/><stop offset="1" stop-color="#0a0605"/></linearGradient>'+
   '<linearGradient id="u'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ae825d"/><stop offset=".45" stop-color="#87562d" stop-opacity=".85"/><stop offset="1" stop-color="#2a1b12" stop-opacity="0"/></linearGradient>'+
   '<linearGradient id="f'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2ebdc"/><stop offset="1" stop-color="#d9ccb2"/></linearGradient></defs>'+
   '<g clip-path="url(#g'+id+')"><rect width="100" height="160" fill="rgba(255,255,255,.05)"/>'+
   (pct>0?'<rect y="'+level+'" width="100" height="'+(160-level)+'" fill="url(#s'+id+')"/>'+
     '<rect y="'+level+'" width="100" height="'+surge+'" fill="url(#u'+id+')"/>'+
     '<rect y="'+(level-foam)+'" width="100" height="'+(foam+1)+'" fill="url(#f'+id+')"/>'+
     '<path d="M0 '+(level-foam)+' q6 -3.5 12.5 0 t12.5 0 t12.5 0 t12.5 0 t12.5 0 t12.5 0 t12.5 0 t12.5 0 V'+(level-foam+3)+' H0Z" fill="#f7f1e4"/>':'')+
   '</g><path d="'+GLASS+'" fill="none" stroke="rgba(242,235,220,.6)" stroke-width="2"/>'+
   '<path d="M19 16 C17 40 19 80 26 120" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3" stroke-linecap="round"/>'+
   '<path d="M27 150 L73 150" stroke="rgba(242,235,220,.35)" stroke-width="2"/>'+
   '</svg>';
}

/* ---------- render: day ---------- */
function renderDay(){
  var st=S.cfg.settings, n=S.viewDay, d=getDay(n), today=curDay(), raw=rawToday();
  var notStarted=raw<1, finished=raw>cycleDays();
  var pct=notStarted?0:Math.round(today/cycleDays()*100);
  var TW=totalWeeks(), cw=weekOf(today), left=Math.max(0,cycleDays()-today);
  var streak=streakAt(n);
  var weeksHtml=''; for(var w=1;w<=TW;w++){ var r=weekRange(w), len=r[1]-r[0]+1, done=notStarted?0:Math.max(0,Math.min(len,today-r[0]+1));
    weeksHtml+='<span class="'+(w===cw&&!notStarted?'cur':'')+'" style="flex:'+len+'"><b style="width:'+(done/len*100)+'%"></b></span>'; }
  var s=dayStats(n);
  var h='';
  h+='<div class="topbar"><div class="brand"><span class="sh">☘</span><b>'+esc(st.cycleTitle||'100 дней')+'</b></div><button class="iconbtn" id="gear" aria-label="Настройки">⚙︎</button></div>';
  h+='<section class="hero"><div class="heroTop"><div class="heroL">'+
     '<span class="tag">'+(notStarted?'До старта '+(1-raw)+' '+plural(1-raw,'день','дня','дней'):finished?'Финиш! Цикл пройден':n===today?'Сегодня':'Архив')+'</span>'+
     '<div class="dayRow"><div class="dayNum">День '+n+'<small>/'+cycleDays()+'</small></div>'+
     '<span class="fire '+(streak?'':'zero')+'" title="Дней подряд без пропуска">🔥 '+streak+'</span></div>'+
     '<div class="dateLine">'+fmtDate(dateOfDay(n))+'</div>'+
     '<div class="nav"><button id="prev" '+(n<=1?'disabled':'')+'>‹ вчера</button>'+(n!==today?'<button id="toToday">сегодня</button>':'')+'<button id="next" '+(n>=today?'disabled':'')+'>завтра ›</button></div>'+
     '</div><div class="pint">'+pintSVG(pct,'h')+'<div class="pintPct">'+pct+'%</div></div></div>'+
     '<div class="weeksBar">'+weeksHtml+'</div>'+
     '<div class="barMeta"><span>Пинта налита на '+pct+'%</span><span>осталось '+left+' '+plural(left,'день','дня','дней')+'</span></div></section>';

  if(st.showWeak!==false){ var wk=weakest(); if(wk){ var g=goalById(wk.h.goal);
    h+='<button class="weak" id="weak" style="--c:'+g.color+'"><span class="ic">🎯</span><span class="tx"><div class="k">Слабое звено недели</div><div class="n">'+esc(wk.h.name)+'</div><div class="s">'+wk.cnt+' из '+wk.len+' '+plural(wk.len,'дня','дней','дней')+' · сегодня самое время отыграться</div></span></button>'; } }

  h+='<section class="card" id="cTasks"><div class="cardH"><h2>Большая тройка</h2><span class="meta">'+s.td+' / '+s.tt+'</span></div>';
  for(var i=0;i<3;i++){ var t=d.t[i];
    h+='<div class="task '+(i===0?'main ':'')+(t.d?'done':'')+'"><span class="n">'+(i+1)+'</span>'+
       '<input type="text" data-ti="'+i+'" value="'+esc(t.x)+'" placeholder="'+(i===0?'Главное дело дня…':'Ещё одно важное…')+'" maxlength="120" enterkeyhint="done">'+
       '<button class="chk" data-tc="'+i+'" aria-label="Готово">'+(t.d?'✓':'')+'</button></div>'; }
  h+='</section>';

  h+='<section class="card" id="cHabits"><div class="cardH"><h2>Привычки</h2><span class="meta">'+s.hd+' / '+s.ht+'</span></div>';
  if(!S.cfg.habits.length) h+='<div class="hint">Привычек пока нет: добавь их в ⚙︎ настройках.</div>';
  S.cfg.goals.concat([{id:'__none'}]).forEach(function(g){
    var list=S.cfg.habits.filter(function(x){ return g.id==='__none' ? !S.cfg.goals.some(function(gg){return gg.id==x.goal;}) : x.goal==g.id; });
    if(!list.length) return; var gg=g.id==='__none'?goalById(null):g;
    h+='<div class="goalGroup"><div class="goalLabel"><i style="background:'+gg.color+'"></i>'+esc(gg.name)+'</div>';
    list.forEach(function(x){ var on=d.h.indexOf(x.id)>=0;
      h+='<button class="habit '+(on?'on':'')+'" data-h="'+x.id+'" style="--c:'+gg.color+'" aria-pressed="'+on+'"><span class="hn">'+esc(x.name)+'</span><span class="dot"></span></button>'; });
    h+='</div>';
  });
  h+='</section>';
  $('app').innerHTML=h;

  var cta=$('cta'); cta.classList.toggle('closed',!!d.c); cta.textContent=d.c?'День '+n+' закрыт ✓ · карточка для сторис':'Закрыть день '+n;

  $('gear').onclick=openSettings;
  $('prev').onclick=function(){ S.viewDay=Math.max(1,n-1); renderDay(); };
  $('next').onclick=function(){ S.viewDay=Math.min(today,n+1); renderDay(); };
  if($('toToday')) $('toToday').onclick=function(){ S.viewDay=today; renderDay(); };
  if($('weak')) $('weak').onclick=function(){ var wk=weakest(); var el=wk&&document.querySelector('[data-h="'+wk.h.id+'"]'); if(!el) return; el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash');},1600); };
  function meta(id,txt){ $(id).querySelector('.meta').textContent=txt; }
  each('[data-h]',function(b){ b.onclick=function(){
    var id=b.getAttribute('data-h'), k=d.h.indexOf(id); if(k>=0) d.h.splice(k,1); else { d.h.push(id); haptic('light'); }
    b.classList.toggle('on',k<0); b.setAttribute('aria-pressed',k<0);
    var q=dayStats(n); meta('cHabits',q.hd+' / '+q.ht); saveDay(n); }; });
  each('[data-ti]',function(inp){
    inp.oninput=function(){ d.t[+inp.getAttribute('data-ti')].x=inp.value; var q=dayStats(n); meta('cTasks',q.td+' / '+q.tt); later('d'+n,function(){saveDay(n);}); };
    inp.onkeydown=function(e){ if(e.key==='Enter') inp.blur(); }; });
  each('[data-tc]',function(btn){ btn.onclick=function(){
    var i=+btn.getAttribute('data-tc'); if(!d.t[i].x.trim()){ toast('Сначала впиши дело ✍️'); return; }
    d.t[i].d=!d.t[i].d; if(d.t[i].d) haptic('medium'); btn.textContent=d.t[i].d?'✓':''; btn.parentNode.classList.toggle('done',d.t[i].d);
    var q=dayStats(n); meta('cTasks',q.td+' / '+q.tt); saveDay(n); }; });
}

/* ---------- close day + story ---------- */

  var n=S.viewDay, d=getDay(n);
  if(!d.c){ d.c=1; saveDay(n); try{ tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success'); }catch(e){} renderDay(); }
  openStory(n);
}

/* ---------- render: week ---------- */
function weekCalc(w){
  var r=weekRange(w), today=curDay(), hd=0,ht=0,td=0,tt=0,cl=0,el=0, perGoal={};
  S.cfg.goals.forEach(function(g){ perGoal[g.id]={d:0,t:0}; });
  for(var n=r[0];n<=Math.min(r[1],today);n++){ el++; var s=dayStats(n); hd+=s.hd; ht+=s.ht; td+=s.td; tt+=s.tt; if(s.c) cl++;
    var day=S.days[n]||{h:[]}; S.cfg.habits.forEach(function(x){ if(!perGoal[x.goal]) return; perGoal[x.goal].t++; if(day.h&&day.h.indexOf(x.id)>=0) perGoal[x.goal].d++; }); }
  var tot=ht+tt, exec=tot?Math.round((hd+td)/tot*100):0;
  return {r:r,len:r[1]-r[0]+1,el:el,hd:hd,ht:ht,td:td,tt:tt,cl:cl,exec:exec,perGoal:perGoal};
}
function renderWeek(){
  var w=S.viewWeek, TW=totalWeeks(), c=weekCalc(w), today=curDay(), wk=getWeek(w);
  var zone = c.el===0 ? ['#76654f','Неделя ещё не началась'] : c.exec>=85 ? ['var(--ok)','Сильный темп'] : c.exec>=65 ? ['var(--yellow)','Ещё можно наверстать'] : ['var(--bad)','План великоват или буксует'];
  var C=2*Math.PI*46, off=C*(1-c.exec/100);
  var h='<div class="topbar"><div class="brand"><span class="sh">☘</span><b>Отчёт недели</b></div><button class="iconbtn" id="gear" aria-label="Настройки">⚙︎</button></div>';
  h+='<section class="photoBan"><div class="wnav"><button id="wPrev" '+(w<=1?'disabled':'')+' aria-label="Прошлая неделя">‹</button><button id="wNext" '+(w>=TW?'disabled':'')+' aria-label="Следующая неделя">›</button></div>'+
     '<div class="in"><span class="tag">'+(w===weekOf(today)?'Текущая неделя':w<weekOf(today)?'Прошедшая неделя':'Впереди')+'</span>'+
     '<div class="t">Неделя '+w+' из '+TW+'</div><div class="s">'+fmtShort(dateOfDay(c.r[0]))+' — '+fmtShort(dateOfDay(c.r[1]))+' · прошло '+c.el+' из '+c.len+' '+plural(c.len,'дня','дней','дней')+'</div></div></section>';

  h+='<section class="card"><div class="score"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="8"/>'+
     '<circle cx="50" cy="50" r="46" fill="none" stroke="'+zone[0]+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"/></svg><div class="v">'+c.exec+'%</div></div>'+

         '<div class="sub">было '+fmtNum(num(g.start))+' → сейчас '+fmtNum(num(g.current))+' → цель '+fmtNum(num(g.target))+unit+'</div>'+
         '<div class="track"><b style="width:'+v+'%;background:'+g.color+'"></b></div></div>'; });
    h+='<div class="hint" style="margin:4px 0 4px">«Сейчас» обновляешь в ⚙︎ настройках, процент пересчитается сам.</div></section>'; }
  h+='<section class="card"><div class="cardH"><h2>Привычки по целям</h2><span class="meta">за неделю</span></div>';

    h+='<div class="gbar"><div class="top"><span>'+esc(g.name)+'</span><span style="color:'+g.color+'">'+v+'%</span></div><div class="track"><b style="width:'+v+'%;background:'+g.color+'"></b></div></div>'; });

  h+='<section class="card" id="cPlan"><div class="cardH"><h2>Тройка недели</h2><span class="meta">'+wk.plan.filter(function(p){return p.d;}).length+' / '+wk.plan.filter(function(p){return p.x.trim();}).length+'</span></div>';
  for(var i=0;i<3;i++){ var p=wk.plan[i]; h+='<div class="task '+(i===0?'main ':'')+(p.d?'done':'')+'"><span class="n">'+(i+1)+'</span><input type="text" data-wp="'+i+'" value="'+esc(p.x)+'" placeholder="Результат недели…" maxlength="120"><button class="chk" data-wc="'+i+'">'+(p.d?'✓':'')+'</button></div>'; }
  h+='</section>';

  h+='<section class="card"><div class="cardH"><h2>Воскресный разбор</h2></div>'+
     '<div class="lbl">Что вышло</div><textarea id="wWins" placeholder="Чем горжусь на этой неделе…">'+esc(wk.wins)+'</textarea>'+
     '<div class="lbl">Чему научилась</div><textarea id="wLess" placeholder="Что мешало и что поменяю…">'+esc(wk.lessons)+'</textarea>';
  if(w<TW){ var nx=getWeek(w+1), nr=weekRange(w+1);
    h+='<div class="lbl">План на неделю '+(w+1)+' ('+fmtShort(dateOfDay(nr[0]))+' — '+fmtShort(dateOfDay(nr[1]))+')</div>';
    for(var j=0;j<3;j++) h+='<div class="task '+(j===0?'main':'')+'"><span class="n">'+(j+1)+'</span><input type="text" data-np="'+j+'" value="'+esc(nx.plan[j].x)+'" placeholder="'+(j===0?'Главный результат следующей недели…':'Ещё результат…')+'" maxlength="120"></div>';
    h+='<button class="btn2" id="wSave">Сохранить и перенести план →</button>';
  } else h+='<button class="btn2" id="wSave">Сохранить разбор</button>';
  h+='<div class="saved" id="wSaved"></div></section>';
  $('app').innerHTML=h;

  $('gear').onclick=openSettings;
  $('wPrev').onclick=function(){ S.viewWeek--; renderWeek(); };

    wk.plan[i].d=!wk.plan[i].d; haptic('medium'); b.textContent=wk.plan[i].d?'✓':''; b.parentNode.classList.toggle('done',wk.plan[i].d);
    $('cPlan').querySelector('.meta').textContent=wk.plan.filter(function(p){return p.d;}).length+' / '+wk.plan.filter(function(p){return p.x.trim();}).length; saveWeek(w); }; });
  $('wSave').onclick=function(){
    wk.wins=$('wWins').value; wk.lessons=$('wLess').value; saveWeek(w);
    if(w<TW){ var nx=getWeek(w+1); each('[data-np]',function(inp){ var j=+inp.getAttribute('data-np'); if(nx.plan[j].x!==inp.value) nx.plan[j]={x:inp.value,d:false}; }); saveWeek(w+1); }
    haptic('medium'); $('wSaved').textContent=w<TW?'Сохранено. План уже ждёт в неделе '+(w+1)+' ✓':'Сохранено ✓';

}

/* ---------- settings ---------- */
function openSettings(){
  var st=S.cfg.settings;
  var goalOpts=function(sel){ return S.cfg.goals.map(function(g){ return '<option value="'+g.id+'" '+(g.id==sel?'selected':'')+'>№'+g.id+'</option>'; }).join(''); };
  var h='<div class="sheetH"><h3>Настройки</h3><button class="iconbtn" id="sClose" aria-label="Закрыть">✕</button></div>';
  h+='<div class="lbl">Цикл</div>'+
     '<div class="field"><label>Дата старта: поменяешь, и всё пересчитается само</label><input type="date" id="sStart" value="'+esc(st.startDate)+'"></div>'+
     '<div class="row2"><div class="field"><label>Длина</label><select id="sLen"><option value="100" '+(cycleDays()===100?'selected':'')+'>100 дней</option><option value="84" '+(cycleDays()===84?'selected':'')+'>12 недель</option></select></div>'+
     '<div class="field"><label>Неделя</label><select id="sWeek"><option value="monday" '+(st.weekStart==='monday'?'selected':'')+'>пн–вс</option><option value="cycle" '+(st.weekStart!=='monday'?'selected':'')+'>от дня старта</option></select></div></div>'+
     '<div class="field"><label>Название цикла</label><input id="sTitle" value="'+esc(st.cycleTitle)+'" maxlength="40"></div>'+
     '<div class="field"><label>Подпись на карточке для сторис</label><input id="sSig" value="'+esc(st.signature)+'" maxlength="30"></div>'+
     '<label class="switch"><span>Показывать «слабое звено» на главном</span><input type="checkbox" id="sWeak" '+(st.showWeak!==false?'checked':'')+'></label>';
  h+='<div class="lbl">Цели и их цвета</div>';
  S.cfg.goals.forEach(function(g){ h+='<div class="gBox" data-grow="'+g.id+'"><div class="gEdit"><input type="color" data-gc="'+g.id+'" value="'+esc(g.color)+'" aria-label="Цвет цели"><input data-gn="'+g.id+'" value="'+esc(g.name)+'" maxlength="40" placeholder="Название цели"><button class="del" data-gdel="'+g.id+'" aria-label="Удалить цель">🗑</button></div>'+
    '<div class="gNums"><label>старт<input inputmode="decimal" data-gf="start" data-g="'+g.id+'" value="'+esc(g.start==null?'':g.start)+'"></label>'+
    '<label>цель<input inputmode="decimal" data-gf="target" data-g="'+g.id+'" value="'+esc(g.target==null?'':g.target)+'"></label>'+
    '<label>сейчас<input inputmode="decimal" data-gf="current" data-g="'+g.id+'" value="'+esc(g.current==null?'':g.current)+'"></label>'+
    '<label>хочу<select data-gf="direction" data-g="'+g.id+'"><option value="less" '+(g.direction==='less'?'selected':'')+'>меньше</option><option value="more" '+(g.direction!=='less'?'selected':'')+'>больше</option></select></label></div></div>'; });
  h+='<button class="btn2" id="gAdd">+ Добавить цель</button>';
  h+='<div class="lbl">Привычки</div><div id="hList">';
  S.cfg.habits.forEach(function(x){ h+='<div class="hEdit" data-row="'+x.id+'"><span class="sw" style="background:'+goalById(x.goal).color+'"></span><input data-hn="'+x.id+'" value="'+esc(x.name)+'" maxlength="40" placeholder="Название привычки"><select data-hg="'+x.id+'" aria-label="Цель">'+goalOpts(x.goal)+'</select><button class="del" data-hd="'+x.id+'" aria-label="Удалить">🗑</button></div>'; });
  h+='</div><button class="btn2" id="hAdd">+ Добавить привычку</button>';
  h+='<button class="btn2" id="sDone">Готово</button>'+
     '<div class="note">💾 Данные сохраняются в: '+esc(Store.kind)+'.<br>Удалённая привычка пропадает из дней и отчётов, отметки по остальным остаются.</div>'+
     '<button class="btn2 danger" id="sReset">Сбросить всё к data.json</button>';
  $('sheetIn').innerHTML=h; $('sheet').classList.add('open');

  $('sStart').onchange=function(){ if(!this.value) return; st.startDate=this.value; saveCfg(); };
  $('sLen').onchange=function(){ st.cycleDays=+this.value; saveCfg(); };
  $('sWeek').onchange=function(){ st.weekStart=this.value; saveCfg(); };
  $('sTitle').oninput=function(){ st.cycleTitle=this.value; later('cfg',saveCfg); };
  $('sSig').oninput=function(){ st.signature=this.value; later('cfg',saveCfg); };
  $('sWeak').onchange=function(){ st.showWeak=this.checked; saveCfg(); };
  each('[data-gc]',function(i){ i.oninput=function(){ goalById(i.getAttribute('data-gc')).color=i.value; each('[data-hg]',function(sel){ sel.parentNode.querySelector('.sw').style.background=goalById(+sel.value).color; }); later('cfg',saveCfg); }; });
  each('[data-gn]',function(i){ i.oninput=function(){ goalById(i.getAttribute('data-gn')).name=i.value; later('cfg',saveCfg); }; });
  each('[data-gf]',function(i){ var f=function(){ goalById(i.getAttribute('data-g'))[i.getAttribute('data-gf')]=i.value; later('cfg',saveCfg); }; i.oninput=f; i.onchange=f; });
  each('[data-gdel]',function(b){ b.onclick=function(){ var id=+b.getAttribute('data-gdel'), g=goalById(id), cnt=S.cfg.habits.filter(function(x){return x.goal==id;}).length;
    askConfirm('Удалить цель «'+(g.name||'без названия')+'»'+(cnt?' и её привычки ('+cnt+')':'')+'?',function(ok){ if(!ok) return;
      S.cfg.goals=S.cfg.goals.filter(function(x){return x.id!=id;}); S.cfg.habits=S.cfg.habits.filter(function(x){return x.goal!=id;}); saveCfg();
      var y=$('sheetIn').scrollTop; openSettings(); $('sheetIn').scrollTop=y; toast('Цель удалена'); }); }; });
  $('gAdd').onclick=function(){ var pal=['#5FB36B','#4F9BE0','#A77BE0','#E8963E','#E0605A','#2fa597','#f6c85f','#d46a9f'];
    var id=S.cfg.goals.reduce(function(m,g){return Math.max(m,+g.id||0);},0)+1;
    S.cfg.goals.push({id:id,name:'',color:pal[(id-1)%pal.length],direction:'more',start:'',target:'',current:''}); saveCfg();
    var y=$('sheetIn').scrollTop; openSettings(); $('sheetIn').scrollTop=y; var inp=document.querySelector('[data-gn="'+id+'"]'); if(inp){ inp.focus(); inp.scrollIntoView({block:'center'}); } };
  each('[data-hn]',function(i){ i.oninput=function(){ hById(i.getAttribute('data-hn')).name=i.value; later('cfg',saveCfg); }; });
  each('[data-hg]',function(sel){ sel.onchange=function(){ var x=hById(sel.getAttribute('data-hg')); x.goal=+sel.value; sel.parentNode.querySelector('.sw').style.background=goalById(x.goal).color; saveCfg(); }; });
  each('[data-hd]',function(b){ b.onclick=function(){ var id=b.getAttribute('data-hd'), x=hById(id);
    askConfirm('Удалить привычку «'+(x.name||'без названия')+'»?',function(ok){ if(!ok) return; S.cfg.habits=S.cfg.habits.filter(function(y){return y.id!==id;}); saveCfg(); var row=document.querySelector('[data-row="'+id+'"]'); if(row) row.remove(); toast('Привычка удалена'); }); }; });
  $('hAdd').onclick=function(){ var id='h'+Date.now().toString(36); S.cfg.habits.push({id:id,name:'',goal:S.cfg.goals.length?S.cfg.goals[0].id:1}); saveCfg(); var y=$('sheetIn').scrollTop; openSettings(); $('sheetIn').scrollTop=y;
    var inp=document.querySelector('[data-hn="'+id+'"]'); if(inp){ inp.focus(); inp.scrollIntoView({block:'center'}); } };
  $('sClose').onclick=$('sDone').onclick=closeSettings;
  $('sheet').onclick=function(e){ if(e.target===$('sheet')) closeSettings(); };
  $('sReset').onclick=function(){ askConfirm('Стереть все свои отметки и вернуть данные из data.json?',function(ok){ if(!ok) return; Store.clear().then(function(){ applyBase(S.base,{}); $('sheet').classList.remove('open'); toast('Сброшено к data.json'); }); }); };
}
function closeSettings(){
  S.cfg.habits=S.cfg.habits.filter(function(x){ return x.name && x.name.trim(); });
  S.cfg.goals=S.cfg.goals.filter(function(g){ return (g.name&&g.name.trim()) || S.cfg.habits.some(function(x){return x.goal==g.id;}); }); saveCfg();
  $('sheet').classList.remove('open'); S.viewDay=Math.min(S.viewDay,curDay()); if(S.viewWeek>totalWeeks()) S.viewWeek=totalWeeks(); render(); }

/* ---------- boot ---------- */
function render(){ if(S.tab==='day') renderDay(); else renderWeek(); $('cta').classList.toggle('hidden',S.tab!=='day');
  $('tabDay').classList.toggle('act',S.tab==='day'); $('tabWeek').classList.toggle('act',S.tab==='week'); window.scrollTo(0,0); }
function applyBase(base,saved){
  var b=JSON.parse(JSON.stringify(base));
  S.cfg={settings:b.settings||{}, goals:b.goals||[], habits:b.habits||[]};
  S.days=b.days||{}; S.weeks=b.weeks||{};
  Object.keys(saved).forEach(function(k){ var v; try{ v=JSON.parse(saved[k]); }catch(e){ return; }
    if(k==='cfg'&&v){ S.cfg.settings=v.settings||S.cfg.settings; S.cfg.goals=v.goals||S.cfg.goals; S.cfg.habits=v.habits||S.cfg.habits; }
    else if(/^d\d+$/.test(k)) S.days[k.slice(1)]=v; else if(/^w\d+$/.test(k)) S.weeks[k.slice(1)]=v; });
  if(!S.cfg.settings.startDate){ var t=new Date(); S.cfg.settings.startDate=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
  S.viewDay=curDay(); S.viewWeek=weekOf(curDay()); render();
}
function showStub(){
  $('dock').classList.add('hidden');
  $('app').innerHTML='<div class="stub">'+pintSVG(0,'e')+'<h2>Бочка пуста</h2><p>Не получилось загрузить данные (data.json). Проверь интернет и попробуй ещё раз: бармен уже меняет кегу.</p><button class="btn2" id="retry">Налить заново</button></div>';
  $('retry').onclick=boot;
}
function boot(){
  $('app').innerHTML='<div class="loader">Наливаем… 🍺</div>';
  var ctrl=('AbortController' in window)?new AbortController():null; var to=setTimeout(function(){ ctrl&&ctrl.abort(); },10000);
  fetch('data.json?v='+Date.now(),{cache:'no-store',signal:ctrl?ctrl.signal:undefined})
    .then(function(r){ clearTimeout(to); if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(base){ if(!base||!base.settings) throw new Error('bad data'); S.base=base; return Store.loadAll().then(function(saved){ $('dock').classList.remove('hidden'); applyBase(base,saved); }); })
    .catch(function(e){ clearTimeout(to); console.warn('data.json',e); showStub(); });
}
$('cta').onclick=onCTA;
$('tabDay').onclick=function(){ S.tab='day'; render(); };
$('tabWeek').onclick=function(){ S.tab='week'; S.viewWeek=weekOf(curDay()); render(); };
boot();
})();
</script>
</body>
</html>
